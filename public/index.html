<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptime Monitor</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M2 12h4l3-7 4 14 3-7h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>Uptime</strong>
          <span>Monitor</span>
        </div>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <a href="#/" class="nav-item" data-route="dashboard">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 3v18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 14l4-4 3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="#/incidents" class="nav-item" data-route="incidents">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Incidents</span>
        </a>
        <a href="#/notifications" class="nav-item" data-route="notifications">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Notifications</span>
        </a>
        <a href="#/status-pages" class="nav-item" data-route="status-pages">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 3h18v18H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7 13l3-3 2 2 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Status pages</span>
        </a>
        <a href="#/api-keys" class="nav-item" data-route="api-keys">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m3 3l2-2-4-4-2 2m2 2l-2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>API keys</span>
        </a>
      </nav>

      <button class="btn btn-primary add-service-btn" id="add-service-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Add service</span>
      </button>

      <div class="sidebar-footer">
        <button class="notif-btn" id="notif-btn" type="button" aria-label="Toggle browser notifications">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="notif-btn-label">Enable alerts</span>
        </button>
        <div class="live-badge" id="live-badge">
          <span class="dot"></span>
          <span>Connecting</span>
        </div>
      </div>
    </aside>

    <main class="main" id="view"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="./js/util.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/uptimeBar.js"></script>
  <script src="./js/chart.js"></script>
  <script src="./js/ws.js"></script>
  <script src="./js/modal.js?v=2"></script>
  <script src="./js/dashboard.js?v=2"></script>
  <script src="./js/detail.js?v=2"></script>
  <script src="./js/incidents.js?v=2"></script>
  <script src="./js/notifications.js?v=2"></script>
  <script src="./js/statusPages.js?v=2"></script>
  <script src="./js/apiKeys.js?v=2"></script>
  <script src="./js/app.js?v=2"></script>
</body>
</html>
